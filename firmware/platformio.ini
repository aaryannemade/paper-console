; Paper Console ESP32-S3 relay firmware (docs/relay-protocol.md).
; Build/flash from the repo root inside `nix develop`:
;   just fw-build | just fw-flash | just fw-monitor

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    olikraus/U8g2@2.36.18

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DPC1_FIRMWARE_VERSION=\"0.1.0\"
    ; Printer UART (XIAO TX = D6/GPIO43, RX = D7/GPIO44). Printer RX <- TX.
    -DPC1_PRINTER_TX_PIN=43
    -DPC1_PRINTER_RX_PIN=44
    -DPC1_PRINTER_BAUD=9600
    -DPC1_PRINTER_WIDTH_DOTS=384
    ; EC11 rotary encoder module (VCC to 3V3): A = D0, B = D1, C (button) = D3.
    -DPC1_ENC_A_PIN=1
    -DPC1_ENC_B_PIN=2
    -DPC1_BUTTON_PIN=4
    ; BOOT button: hold 5 s while running to erase settings and reopen setup.
    -DPC1_RESET_BUTTON_PIN=0
    ; XIAO user LED (GPIO21, active low): lit during the encoder reset sequence.
    -DPC1_STATUS_LED_PIN=21
    ; SSD1306 128x64 I2C OLED (VCC to 3V3): SDA = D4/GPIO5, SCL = D5/GPIO6.
    ; Rotation 0 or 2 (180 degrees, for a module mounted upside down).
    -DPC1_OLED_SDA_PIN=5
    -DPC1_OLED_SCL_PIN=6
    -DPC1_OLED_ROTATION=0
