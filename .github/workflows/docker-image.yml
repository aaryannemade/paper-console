name: Docker image (manual)

# Manually builds the multi-stage Dockerfile and publishes a development image
# to GitHub Container Registry (ghcr.io/<owner>/<repo>). Nothing runs on push.
# Versioned images and :latest are published only by the Release workflow.
#
# Tags produced: :<tag input> (default "edge") and :sha-<short>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag (not "latest" or a version; releases own those)
        required: true
        default: edge
      push:
        description: Push to GHCR (unchecked = build only)
        type: boolean
        default: true

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "::error::Invalid tag '$TAG' (lowercase letters, digits, . _ -)"; exit 1
          fi
          if [[ "$TAG" == latest || "$TAG" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            echo "::error::'$TAG' is reserved for the Release workflow"; exit 1
          fi

      - name: Lowercase image name and app version
        env:
          TAG: ${{ inputs.tag }}
        # GHCR rejects uppercase repository names. The version is shown in
        # Settings > Version (the image has no .git directory).
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${TAG}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
