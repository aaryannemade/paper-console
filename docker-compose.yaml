services:
  paper-console:
    build: .
    image: paper-console:local
    restart: unless-stopped
    # Run as the host user/group that owns the /data bind mount
    # (`id -u` / `id -g`, e.g. 1000:100 on NixOS). Set PUID/PGID in .env.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777
    ports:
      - "${PC1_HOST_PORT:-8000}:${PC1_PORT:-8000}"
    environment:
      PC1_PORT: ${PC1_PORT:-8000}
      PC1_DATA_DIR: /data
      PC1_PRINTER_OUTPUT: ${PC1_PRINTER_OUTPUT:-esp32}
      PC1_DEVICE_PASSWORD: ${PC1_DEVICE_PASSWORD:-}
      PC1_RELAY_TOKEN: ${PC1_RELAY_TOKEN:-}
      PC1_RELAY_URL: ${PC1_RELAY_URL:-}
      PC1_SESSION_SECRET: ${PC1_SESSION_SECRET:-}
      PC1_CORS_ORIGINS: ${PC1_CORS_ORIGINS:-}
      TZ: ${TZ:-UTC}
    volumes:
      # Persistent settings, saves and generated password. To restore defaults,
      # stop the stack and empty this dedicated host directory; `down -v`
      # does not delete bind-mount contents.
      - /path/to/data:/data
