# Build `paper-console:local` on the Docker host first, or set PC1_IMAGE to a
# published image in Portainer's stack environment variables.
services:
  paper-console:
    image: ${PC1_IMAGE:-paper-console:local}
    restart: unless-stopped
    # NixOS puts the first user in a 1000:100 (uid:gid) pair, while the
    # container's non-root user is 1000:1000. userns_mode=keep-id remaps the
    # container's UID 1000 to your host UID so the bind-mounted data
    # directory stays writable without chown.
    userns_mode: keep-id
    ports:
      - "${PC1_HOST_PORT:-8000}:${PC1_PORT:-8000}"
    environment:
      PC1_PORT: ${PC1_PORT:-8000}
      PC1_DATA_DIR: /data
      PC1_PRINTER_OUTPUT: ${PC1_PRINTER_OUTPUT:-esp32}
      PC1_DEVICE_PASSWORD: ${PC1_DEVICE_PASSWORD:-}
      PC1_RELAY_TOKEN: ${PC1_RELAY_TOKEN:-}
      PC1_RELAY_URL: ${PC1_RELAY_URL:-}
      PC1_SESSION_SECRET: ${PC1_SESSION_SECRET:-}
      PC1_CORS_ORIGINS: ${PC1_CORS_ORIGINS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - /path/to/data:/data
